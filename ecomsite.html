<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E-Commerce site</title>
  <link rel="stylesheet" href="ecomsite.css">
</head>
<body>

  <header>
    <h1>Ajio</h1>
    <h2> products </h2>
    <div class="cart">
      🛒 Cart: <span id="cart-count">0</span>
    </div>
  </header>

  <main class="products">
    <div class="product">
      <img src="images1.jpg" alt="Product 1">
      <h3>watch</h3>
      <p>3999</p>
      <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="product">
      <img src="image2.webp" alt="Product 2">
      <h3>smart phone</h3>
      <p>$25000</p>
      <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="product">
      <img src="image4.webp" alt="Product 3">
      <h3>laptop</h3>
      <p>$85999</p>
      <button onclick="addToCart()">Add to Cart</button>
    </div>
    <div class="product">
      <img src="image5.webp" alt="Product 3">
      <h3>telivision</h3>
      <p>$25999</p>
      <button onclick="addToCart()">Add to Cart</button>
    </div>
    <div class="product">
      <img src="image06.jpg" alt="Product 3">
      <h3>baby toy</h3>
      <p>$399</p>
      <button onclick="addToCart()">Add to Cart</button>
    </div>
    <div class="product">
      <img src="image8.webp" alt="Product 3">
      <h3>cloth organizer</h3>
      <p>$12999</p>
      <button onclick="addToCart()">Add to Cart</button>
    </div>
  </main>

  <script src="ecomsite.js"></script>
</body>
</html>
