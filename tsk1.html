<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>traffic Status Cheaker</title>
    </head>
    <script>
        let visitors=prompt("Enter the number of visitors.");
        if(visitors>10000) {
            document.write("High traffic");
        }
        else if(visitors>=5000 && visitors<=10000 ) {
            document.write("Medium traffic");
        }
        else{
            document.write("Low traffic");
        }
    </script>
<body>
    
</body>
</html>
